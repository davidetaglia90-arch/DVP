<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DVP">
<meta name="application-name" content="DVP">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>DVP – Design Verification Plan</title>
<style>
:root{--ink:#1c2430;--mut:#5d6877;--line:#d9dee5;--bg:#f4f6f9;--card:#fff;--acc:#1f3a5f;--acc2:#e8eef5;--ok:#1d7a46;--warn:#b26a00;--bad:#b3261e}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
body.busy{cursor:progress}
header.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 24px;background:var(--acc);color:#fff;position:sticky;top:0;z-index:30}
.brand h1{margin:0;font-size:17px}
.brand span{font-size:12px;opacity:.8}
.brand #saved{display:block;font-size:11px;opacity:.65}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.top-actions .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
.top-actions .btn:hover{background:rgba(255,255,255,.12)}
.top-actions .btn.primary{background:#fff;color:var(--acc);border-color:#fff;font-weight:600}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;max-width:1560px;margin:0 auto;padding:20px 24px 60px}
nav#nav{position:sticky;top:84px;align-self:start;display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:8px;cursor:pointer;font:inherit;color:var(--ink)}
.nav-item:hover{background:#e9edf3}
.nav-item.on{background:var(--acc2);font-weight:600;color:var(--acc)}
.dot{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:#e3e7ed;color:var(--mut)}
.dot.s1{background:#f6dfae;color:#7a4b00}
.dot.s2{background:var(--ok);color:#fff}
main{min-width:0}
.step-head{margin-bottom:14px}
.kicker{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut)}
h2{margin:2px 0 4px;font-size:24px;color:var(--acc)}
.lead{margin:0;color:var(--mut);max-width:860px}
h3{margin:0 0 6px;font-size:16px}
h4{margin:0 0 8px;font-size:14px;color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
.card.inner{border:0;padding:0;margin:0}
.subcard{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:14px;display:grid;gap:12px}
.hint{margin:0 0 12px;color:var(--mut);font-size:13px}
.small{font-size:12.5px;color:var(--mut)}
.muted{color:#8a94a3}
.note{background:#fff8e6;border:1px solid #f0dca8;border-radius:10px;padding:10px 14px;font-size:13px;color:#5b4500;margin-bottom:16px}
.empty{color:var(--mut);font-style:italic;margin:8px 0 14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.f{display:flex;flex-direction:column;gap:4px}
.f.wide{grid-column:1/-1}
.f>span{font-size:12.5px;font-weight:600;color:#364152}
input,select,textarea{font:inherit;color:inherit;border:1px solid #c4ccd6;border-radius:7px;padding:7px 9px;background:#fff;width:100%}
textarea{resize:vertical;min-height:38px}
input:focus,select:focus,textarea:focus{outline:2px solid #7ea6d6;border-color:#7ea6d6}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid #c4ccd6;border-radius:999px;padding:6px 12px;cursor:pointer;background:#fff;user-select:none}
.chip input{width:auto;margin:0}
.chip:has(input:checked){background:var(--acc2);border-color:var(--acc);color:var(--acc);font-weight:600}
.btn{font:inherit;border:1px solid #b7c1ce;background:#fff;color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;display:inline-block}
.btn:hover{background:#eef2f7}
.btn[disabled]{opacity:.45;cursor:default}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary:hover{background:#2b4d7d}
.btn.danger{color:var(--bad);border-color:#e3b3af}
.btn.danger:hover{background:#fbe5e3}
.btn.small{padding:4px 10px;font-size:12.5px}
.btn.big{padding:11px 20px;font-size:15px}
.row-actions{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0;align-items:center}
.row-actions select{width:auto;max-width:360px}
.pager{display:flex;justify-content:space-between;margin-top:22px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin:8px 0 12px;max-height:70vh}
table.grid{border-collapse:separate;border-spacing:0;table-layout:fixed;min-width:100%}
.grid th{position:sticky;top:0;background:#eef2f7;text-align:left;font-size:12px;padding:8px;border-bottom:1px solid var(--line);z-index:2;white-space:normal}
.grid td{padding:5px 6px;border-bottom:1px solid #edf0f4;vertical-align:top}
.grid td.act,.grid th.act-h{position:sticky;left:0;background:#f8fafc;z-index:1;white-space:nowrap;min-width:90px}
.grid th.act-h{z-index:3;background:#eef2f7}
.grid input,.grid select,.grid textarea{padding:5px 7px;font-size:13px}
.ro{display:inline-block;padding:6px 4px;font-weight:600;color:var(--acc)}
.icon{border:1px solid #d3d9e2;background:#fff;border-radius:6px;width:26px;height:26px;cursor:pointer;color:var(--mut);padding:0}
.icon:hover{background:#eef2f7}
.icon.del:hover{background:#fbe5e3;color:var(--bad);border-color:#f0b9b4}
.calc{display:inline-block;padding:6px 4px;font-weight:600}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:#e8ebf0;color:var(--mut)}
.badge.Alto,.badge.Alta{background:#f8d3d0;color:var(--bad)}
.badge.Medio,.badge.Media{background:#fce8b8;color:#7a4b00}
.badge.Basso{background:#d5efd9;color:var(--ok)}
.badge.Info{background:#e3e9f2;color:#44546a}
.chk-row{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:14px;align-items:center;padding:7px 0;border-bottom:1px solid #edf0f4}
.chk-row:last-child{border-bottom:0}
.fname{display:inline-block;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle;font-size:12.5px}

/* pezzo */
.split{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,1fr);gap:16px;align-items:start}
.split>.card:first-child{position:sticky;top:84px}
.ccard{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;display:grid;gap:8px;background:#fcfdfe}
.cc-h{display:flex;align-items:center;gap:8px}
.cc-h select{width:auto}
.cc-meta{margin-left:auto;font-size:12px;color:var(--mut)}
.cid{display:inline-grid;place-items:center;min-width:34px;height:26px;padding:0 6px;border-radius:999px;background:var(--acc);color:#fff;font-weight:700;font-size:12px}
.drop{border:2px dashed #b7c1ce;border-radius:12px;padding:26px;text-align:center;background:#fafbfd}
.drop.over{background:var(--acc2);border-color:var(--acc)}
.drop b{font-size:15px}
.drop p{margin:6px auto;max-width:560px}
.drop .row-actions{justify-content:center}

/* annotatore */
.annot{margin:6px 0}
.a-tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.tool{font:inherit;font-size:12.5px;border:1px solid #b7c1ce;background:#fff;border-radius:7px;padding:5px 10px;cursor:pointer}
.tool:hover{background:#eef2f7}
.tool.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #b7c1ce;cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 2px var(--acc)}
.sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.a-stage{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;line-height:0}
.a-stage canvas{display:block;cursor:crosshair;max-width:100%}

/* ciclo */
.tpls{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.tpl{text-align:left;font:inherit;border:1px solid #b7c1ce;background:#fff;border-radius:10px;padding:12px 14px;cursor:pointer;display:grid;gap:4px}
.tpl:hover{background:var(--acc2);border-color:var(--acc)}
.tpl span{color:var(--mut);font-size:12.5px}
.flow-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.flow-scroll{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fafbfd;max-height:520px;padding:4px}
.flow-inner{position:relative}
.flow-inner .edges{position:absolute;left:0;top:0;pointer-events:none}
.node{position:absolute;background:#fff;border:1px solid #b7c1ce;border-left:5px solid var(--acc);border-radius:10px;padding:7px 10px 6px;cursor:pointer;display:flex;flex-direction:column;gap:2px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.node:hover{box-shadow:0 2px 8px rgba(31,58,95,.18)}
.node.sel{outline:3px solid #7ea6d6;border-color:var(--acc)}
.node.k-acq{border-left-color:#1b8a8f}
.node.k-ctrl{border-left-color:#7b4fa8}
.node.k-log{border-left-color:#7a8696}
.node.r-Alto{background:#fff5f4}
.node.r-Medio{background:#fffaf0}
.n-top{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--mut)}
.n-top .code{background:var(--acc);color:#fff;border-radius:999px;padding:0 8px;font-weight:700}
.n-top .ext{margin-left:auto;background:#fce8b8;color:#7a4b00;border-radius:999px;padding:0 7px;font-weight:600}
.n-name{font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.n-tech{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n-badges{display:flex;gap:4px;flex-wrap:wrap;min-height:20px}
.b{font-size:11px;border-radius:999px;padding:0 7px;background:#e8ebf0;color:#44546a}
.b.muted{background:transparent;color:#a0a9b6;font-style:italic;padding-left:0}
.b.rk.Alto{background:#f8d3d0;color:var(--bad)}
.b.rk.Medio{background:#fce8b8;color:#7a4b00}
.b.rk.Basso{background:#d5efd9;color:var(--ok)}
.n-btns{display:flex;gap:6px;margin-top:auto}
.n-btns button{font:inherit;font-size:11.5px;border:1px solid #c4ccd6;background:#fff;border-radius:6px;padding:1px 8px;cursor:pointer;color:var(--acc)}
.n-btns button:hover{background:var(--acc2)}
.ph-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.ph-top h3{font-size:19px;color:var(--acc)}
.pchips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.pchip{font:inherit;font-size:12px;border:1px solid #c4ccd6;background:#fff;border-radius:999px;padding:2px 10px;cursor:pointer;color:var(--mut)}
.pchip.ok{background:#e1f3e6;border-color:#a9d6b5;color:var(--ok)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:10px 0 14px;flex-wrap:wrap}
.tab{font:inherit;border:0;background:transparent;padding:9px 14px;cursor:pointer;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-2px}
.tab:hover{color:var(--acc)}
.tab.on{color:var(--acc);font-weight:600;border-bottom-color:var(--acc)}
.links{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lk-l{font-weight:600;font-size:12.5px;color:#364152}
.lk{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px}
.lk .icon{width:20px;height:20px;font-size:11px}

/* prove suggerite */
.sug{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:6px;cursor:pointer;background:#fff}
.sug:hover{background:#f3f7fb}
.sug input{width:auto;margin-top:3px}
.sug small{display:block;color:var(--mut)}
.why{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.why span{font-size:11.5px;background:var(--acc2);color:var(--acc);border-radius:999px;padding:1px 8px}
.prompts{display:flex;flex-direction:column;gap:6px}
.prompt{text-align:left;font:inherit;border:1px dashed #b7c1ce;background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}
.prompt:hover{background:#eef2f7;border-style:solid}

/* piano e riepilogo */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.metric{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.metric b{display:block;font-size:28px;color:var(--acc);line-height:1.1}
.metric span{color:var(--mut);font-size:13px}
.metric.ok b{color:var(--ok)}
.metric.bad b{color:var(--bad)}
.metric.warn b{color:var(--warn)}
table.plain,table.mx{border-collapse:collapse;width:100%}
.plain th,.plain td,.mx th,.mx td{padding:7px 8px;border-bottom:1px solid #edf0f4;text-align:left;vertical-align:top}
.plain th,.mx th{background:#eef2f7;font-size:12px;white-space:nowrap}
.plain td.c{text-align:center}
.mx th small{display:block;font-weight:400;color:var(--mut);max-width:70px;overflow:hidden;text-overflow:ellipsis}
.mx th{text-align:center}
.mx td.mx-n{min-width:220px}
.mx-c{text-align:center;font-weight:700;min-width:48px}
.mx-c.g{background:#d5efd9}
.mx-c.i{background:#fce8b8}
.mx-c.t{background:#e8eef5}
table.gaps{width:100%;border-collapse:collapse}
.gaps td{padding:7px 8px;border-bottom:1px solid #edf0f4;vertical-align:top}
.gaps tr.go{cursor:pointer}
.gaps tr.go:hover{background:#f1f5fa}
.gap-area{white-space:nowrap;color:var(--mut);width:1%}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#1c2430;color:#fff;padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:1000px){
 .split{grid-template-columns:1fr}
 .split>.card:first-child{position:static}
}
@media (max-width:900px){
 .layout{grid-template-columns:1fr;padding:14px}
 nav#nav{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}
 .nav-item{white-space:nowrap}
 .nav-item span:last-child{display:none}
 .nav-item.on span:last-child{display:inline}
 header.top{padding:10px 14px}
 .chk-row{grid-template-columns:1fr}
}

.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.thumb{width:130px;border:2px solid var(--line);border-radius:8px;background:#fff;padding:4px;cursor:pointer;display:grid;gap:3px;font:inherit;text-align:left}
.thumb img{width:100%;height:78px;object-fit:cover;border-radius:4px;background:#eee}
.thumb span{font-size:11px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb.on{border-color:var(--acc)}
.thumb.add{place-items:center;align-content:center;height:112px;border-style:dashed;color:var(--acc)}
.thumb.add b{font-size:26px}
table.files td{vertical-align:middle}
#voice{position:fixed;right:16px;bottom:16px;z-index:50;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.18);padding:8px 10px;max-width:min(420px,calc(100vw - 32px))}
#voice .v-row{display:flex;align-items:center;gap:10px}
#voice .vmic{width:42px;height:42px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:19px;cursor:pointer;flex:none}
#voice .vmic.on{background:#d62828;animation:vp 1.2s infinite}
#voice .vmic.off{background:#9aa5b4;cursor:not-allowed}
#voice .v-info{display:grid;min-width:0;font-size:12px}
#voice .v-info b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#voice .v-info span{color:var(--mut);font-style:italic;max-height:34px;overflow:hidden}
#voice select{width:auto;font-size:12px;padding:3px}
@keyframes vp{50%{box-shadow:0 0 0 8px rgba(214,40,40,.2)}}
@media print{#voice{display:none}}

/* ===== grafica: rifinitura generale ===== */
:root{--r:14px;--sh:0 1px 2px rgba(20,34,56,.06),0 4px 14px rgba(20,34,56,.06);--teal:#0f766e;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{overscroll-behavior-y:none}
.card{border-radius:var(--r);box-shadow:var(--sh)}
.btn,.tab,.chip,.nav-item,.tpl,.prompt{touch-action:manipulation}
header.top{padding-top:max(12px,var(--safe-t))}
#prog{display:none;height:3px;background:rgba(255,255,255,.22);position:sticky;top:0;z-index:31}
#prog i{display:block;height:100%;width:0;background:#7fe0c9;transition:width .25s}
.menu-btn{display:none;background:transparent;border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:10px;width:42px;height:42px;font-size:20px;line-height:1;cursor:pointer}
#fab{position:fixed;right:16px;bottom:84px;z-index:45;display:flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--teal);color:#fff;padding:0 18px 0 14px;height:52px;font:inherit;font-weight:600;box-shadow:0 6px 18px rgba(15,118,110,.45);cursor:pointer}
#fab .ic{font-size:21px}
#fab:active{transform:scale(.97)}
#bar{display:none}
/* fogli (bottom sheet) */
#sheet{position:fixed;inset:0;z-index:80;display:none}
#sheet.open{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(15,23,36,.5)}
.sheet-body{position:absolute;left:0;right:0;bottom:0;max-height:92vh;max-height:92dvh;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:10px 18px calc(18px + var(--safe-b));box-shadow:0 -10px 40px rgba(0,0,0,.3);animation:up .22s ease-out;margin:0 auto;max-width:720px}
@media(min-width:721px){.sheet-body{bottom:auto;top:6vh;border-radius:18px;max-height:88vh}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet-grip{width:44px;height:5px;border-radius:3px;background:#d3d9e2;margin:2px auto 10px}
.sheet-body h3{font-size:18px;color:var(--acc);margin:0 0 4px}
.sheet-x{float:right;border:0;background:#eef2f7;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer}
.d-text{min-height:140px;font-size:16px;line-height:1.45}
.d-ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.d-mic{width:64px;height:64px;border-radius:50%;border:0;background:var(--teal);color:#fff;font-size:28px;cursor:pointer;flex:none;box-shadow:0 4px 14px rgba(15,118,110,.4)}
.d-mic.on{background:#d62828;animation:vp 1.2s infinite}
.d-mic.off{background:#9aa5b4}
.d-live{flex:1;min-width:120px;font-size:13px;color:var(--mut);font-style:italic}
.d-go{width:100%;font-size:16px;padding:13px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.seg button{font:inherit;font-size:13px;border:1px solid #c4ccd6;background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.pv{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:#fafcfe}
.pv input{width:22px;height:22px;margin-top:2px;flex:none}
.pv b{display:block;font-size:13px;color:var(--acc)}
.pv span{font-size:13.5px;display:block;overflow-wrap:anywhere}
.pv.off{opacity:.45}
.sheet-body details{margin:12px 0;font-size:13px}
.sheet-body summary{cursor:pointer;color:var(--acc);font-weight:600}
.steplist{display:grid;gap:6px;margin-top:10px}
.steplist .nav-item{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
.flow-list{display:none}
.fl{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:12px;background:#fff;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.fl.k-acq{border-left-color:#1b8a8f}.fl.k-ctrl{border-left-color:#7b4fa8}.fl.k-log{border-left-color:#7a8696}
.fl.sel{outline:3px solid #7ea6d6}
.fl.r-Alto{background:#fff5f4}.fl.r-Medio{background:#fffaf0}
.fl .code{flex:none;background:var(--acc);color:#fff;border-radius:999px;min-width:34px;text-align:center;padding:2px 8px;font-weight:700;font-size:12.5px}
.fl .mid{min-width:0;flex:1}
.fl .nm{font-weight:600;line-height:1.25}
.fl .sub{font-size:12.5px;color:var(--mut);overflow-wrap:anywhere}
.fl .from{font-size:12px;color:#7a4b00;background:#fce8b8;border-radius:999px;padding:0 8px;display:inline-block;margin-top:3px}
.fl .acts{display:flex;flex-direction:column;gap:6px;flex:none}
.fl .acts button{font:inherit;font-size:12px;border:1px solid #c4ccd6;background:#fff;border-radius:8px;padding:5px 9px;cursor:pointer;color:var(--acc)}
#toast{max-width:calc(100vw - 32px);text-align:center}

/* ===== telefono ===== */
@media (max-width:900px){
 body{padding-bottom:calc(70px + var(--safe-b))}
 .layout{padding:12px 12px 24px;gap:0}
 nav#nav,.pager{display:none}
 header.top{padding:max(10px,var(--safe-t)) 12px 10px;gap:8px;position:sticky}
 #prog{display:block}
 .brand h1{font-size:16px}
 .brand #saved{display:none}
 .menu-btn{display:block}
 .top-actions{display:none;position:absolute;right:10px;top:calc(100% + 6px);flex-direction:column;background:#fff;border-radius:14px;padding:8px;box-shadow:0 12px 36px rgba(0,0,0,.28);min-width:210px;z-index:60}
 .top-actions.open{display:flex}
 .top-actions .btn,.top-actions .btn.primary{background:#fff;color:var(--ink);border:0;text-align:left;padding:12px 14px;font-size:15px;border-radius:10px;font-weight:500}
 .top-actions .btn:active{background:#eef2f7}
 .top-actions .btn.primary{color:var(--acc);font-weight:700}
 h2{font-size:21px}
 .lead{font-size:14px}
 .card{padding:14px;margin-bottom:12px}
 .subcard{padding:12px}
 input,select,textarea{font-size:16px;padding:10px 11px;border-radius:10px}
 .btn{min-height:42px;padding:9px 14px}.btn.small{min-height:38px;padding:7px 12px;font-size:13.5px}
 .icon{width:38px;height:38px;font-size:15px}
 .chip{padding:9px 13px}
 .grid2{grid-template-columns:1fr}
 .metrics{grid-template-columns:repeat(2,1fr)}
 .metric b{font-size:24px}
 .tabs{overflow-x:auto;flex-wrap:nowrap;gap:2px;margin-left:-14px;margin-right:-14px;padding:0 14px;scrollbar-width:none}
 .tabs::-webkit-scrollbar{display:none}
 .tab{white-space:nowrap;padding:11px 14px;flex:none}
 .flow-scroll{display:none}
 .flow-list{display:block}
 .flow-card>.hint{display:none}
 .ph-top .row-actions{width:100%}
 .tpls{grid-template-columns:1fr}
 .row-actions{gap:8px}
 .row-actions select{max-width:100%;width:100%}
 .a-tools{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px;scrollbar-width:none}.tool{flex:none;min-height:38px}
 .sw{width:30px;height:30px;flex:none}
 .a-stage canvas{width:100%!important}
 .thumb{width:110px}
 .chk-row{padding:10px 0}
 /* tabelle -> schede */
 .tbl-wrap{border:0;max-height:none;overflow:visible;margin:6px 0}
 table.grid{display:block;width:100%!important;table-layout:auto}
 table.grid colgroup,table.grid thead{display:none}
 table.grid tbody{display:block}
 table.grid tr{display:block;background:#fff;border:1px solid var(--line);border-radius:14px;margin:0 0 12px;padding:10px 12px;box-shadow:var(--sh)}
 table.grid td{display:block;border:0;padding:5px 0}
 table.grid td[data-l]::before{content:attr(data-l);display:block;font-size:12px;font-weight:600;color:#364152;margin-bottom:2px}
 table.grid td.act{position:static;background:transparent;min-width:0;display:flex;gap:8px;justify-content:flex-end;padding:0 0 4px}
 table.grid td:empty{display:none}
 .grid input,.grid select,.grid textarea{font-size:16px;padding:10px 11px}
 table.plain th,table.plain td{white-space:nowrap}
 /* barra inferiore */
 #bar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:44;background:#fff;border-top:1px solid var(--line);padding:8px 10px calc(8px + var(--safe-b));gap:8px;align-items:center;box-shadow:0 -4px 16px rgba(20,34,56,.08)}
 #bar .b-nav{flex:none;width:54px;height:46px;border:1px solid #b7c1ce;background:#fff;border-radius:12px;font-size:20px;color:var(--acc);cursor:pointer}
 #bar .b-nav[disabled]{opacity:.35}
 #bar .b-step{flex:1;min-width:0;height:46px;border:0;background:var(--acc2);border-radius:12px;font:inherit;color:var(--acc);font-weight:600;display:flex;flex-direction:column;justify-content:center;align-items:center;line-height:1.15;cursor:pointer}
 #bar .b-step small{font-weight:400;font-size:11px;color:var(--mut)}
 #bar .b-step span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px}
 #fab{bottom:calc(76px + var(--safe-b));right:12px;height:54px}
 #voice{display:none;left:10px;right:auto;bottom:calc(138px + var(--safe-b));padding:6px 8px;max-width:calc(100vw - 150px)}
 body.fieldfocus #voice{display:block}
 #voice .v-info{display:none}
 #voice select{display:none}
 #voice .vmic{width:46px;height:46px}
 body.sheet-open #voice,body.sheet-open #fab{display:none!important}
 #toast{bottom:calc(150px + var(--safe-b))}
}
body.sheet-open #voice,body.sheet-open #fab{display:none!important}
@media print{#fab,#bar,#sheet,.menu-btn{display:none!important}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<header class="top">
  <div class="brand"><h1>Design Verification Plan</h1><span id="sub">Percorso guidato</span><span id="saved"></span></div>
  <button class="menu-btn" data-act="menu" aria-label="Menu">⋯</button>
  <div class="top-actions" id="topActions">
    <button class="btn" data-act="install">Installa sul telefono</button>
    <button class="btn" data-act="aiSet">Impostazioni AI</button>
    <button class="btn" data-act="new">Nuovo</button>
    <button class="btn" data-act="load">Carica progetto</button>
    <button class="btn" data-act="save">Salva progetto</button>
    <button class="btn" data-act="report">Report</button>
    <button class="btn primary" data-act="export">Esporta Excel</button>
    <input type="file" id="loadFile" accept=".json,application/json" hidden>
  </div>
</header>
<div id="prog"><i></i></div>
<div class="layout"><nav id="nav"></nav><main id="main"></main></div>
<button id="fab" data-act="dictate" aria-label="Detta e compila"><span class="ic">🎙</span><span>Detta</span></button>
<div id="bar"><button class="b-nav" data-act="prev" id="bPrev" aria-label="Indietro">←</button><button class="b-step" data-act="steps" id="bStep"><span id="bTitle"></span><small id="bSub"></small></button><button class="b-nav" data-act="next" id="bNext" aria-label="Avanti">→</button></div>
<div id="sheet"><div class="sheet-bg" data-act="closeSheet"></div><div class="sheet-body" id="sheetBody"></div></div>
<div id="toast"></div>
<script>(function (root) {
'use strict';

/* =====================================================================
   COSTANTI E LIBRERIE
   ===================================================================== */

const STEP = { prog: 0, pezzo: 1, func: 2, ciclo: 3, piano: 4, dec: 5, sum: 6 };

const DOC_LIST = [
  { k: 'dis2d', t: 'Disegno 2D cliente (PDF / DWG)', req: 'Sì' },
  { k: 'cad3d', t: 'Modello 3D (STEP / IGES / Parasolid)', req: 'Sì' },
  { k: 'matspec', t: 'Specifica materiale / norma del materiale', req: 'Sì' },
  { k: 'procspec', t: 'Specifiche di processo del cliente (rivestimento, trattamento termico, saldatura, …)', req: 'No' },
  { k: 'testspec', t: 'Specifiche / capitolato di prova del cliente', req: 'No' },
  { k: 'csr', t: 'Customer Specific Requirements (CSR) / quality agreement', req: 'No' },
  { k: 'rfq', t: 'RFQ / capitolato commerciale (volumi, SOP, durata programma)', req: 'No' },
  { k: 'pack', t: 'Requisiti di imballaggio e logistica', req: 'No' },
  { k: 'fmea', t: 'FMEA / Piano di controllo del cliente (se esistenti)', req: 'No' },
  { k: 'hist', t: 'Storico problemi / lessons learned / campioni reclamati', req: 'No' },
  { k: 'master', t: 'Pezzo fisico campione / master', req: 'No' }
];
const DOC_STATI = ['Da ricevere', 'Ricevuto', 'Da richiedere', 'Non applicabile'];

const DRAW_CHECKS = [
  'Revisione e data del disegno riportate e coerenti con il modello 3D',
  'Materiale e norma di riferimento indicati',
  'Tolleranze generali indicate (es. ISO 2768 / ISO 22081)',
  'Quote funzionali con tolleranze e riferimenti (datum) definiti, GD&T dove necessario',
  'Caratteristiche speciali / critiche marcate (KC, CC, SC o simboli del cliente)',
  'Trattamenti termici e/o superficiali specificati (tipo, spessore, durezza, norma)',
  'Rugosità / finitura superficiale richiesta',
  'Spigoli e bave definiti (es. ISO 13715)',
  'Marcatura, tracciabilità e identificazione del pezzo richieste',
  'Zone da mascherare / punti di contatto e sospensione ammessi (per rivestimenti)',
  'Requisiti di pulizia tecnica / contaminazione',
  'Massa o peso di riferimento indicati',
  'Riferimenti a specifiche cliente e norme di prova esplicitati'
];
const CHECK_OPTS = [['Da verificare', 'Da verificare'], ['Sì', 'Sì'], ['No', 'No – da chiedere al cliente'], ['N.A.', 'Non applicabile']];

const FUNC_FIELDS = [
  { k: 'funzione', l: 'Qual è la funzione principale del pezzo e in quale assieme/sistema opera?', rows: 3, wide: 1 },
  { k: 'interfacce', l: 'Con quali componenti si interfaccia e come viene montato o fissato?', rows: 2, wide: 1 },
  { k: 'vita', l: 'Vita attesa e profilo di missione (km, ore, anni, cicli)?', rows: 2 },
  { k: 'volume', l: 'Volumi annui previsti (pezzi/anno) e durata del programma?', rows: 2 },
  { k: 'lotto', l: 'Dimensione tipica del lotto e frequenza di consegna?', rows: 2 },
  { k: 'norme', l: 'Norme, specifiche e CSR del cliente applicabili (con revisione)?', rows: 2 },
  { k: 'storico', l: 'Problemi noti, reclami o lessons learned su pezzi simili?', rows: 2, wide: 1 },
  { k: 'note', l: 'Altre informazioni utili', rows: 2, wide: 1 }
];

const ENV = [
  { k: 'corr', t: 'Corrosione (atmosfera, sale stradale, umidità)' },
  { k: 'hot', t: 'Temperatura elevata / cicli termici' },
  { k: 'cold', t: 'Basse temperature' },
  { k: 'vib', t: 'Vibrazioni / urti' },
  { k: 'stat', t: 'Carichi statici / strutturali' },
  { k: 'fat', t: 'Fatica / carichi ciclici' },
  { k: 'press', t: 'Pressione / tenuta a fluidi o gas' },
  { k: 'fluid', t: 'Contatto con fluidi (olio, carburante, refrigerante, chimici)' },
  { k: 'uv', t: 'Esposizione esterna / UV' },
  { k: 'cosm', t: 'Aspetto estetico / superficie a vista' },
  { k: 'elec', t: 'Funzione elettrica (continuità, isolamento, schermatura)' },
  { k: 'wear', t: 'Usura / attrito / scorrimento' },
  { k: 'clean', t: 'Pulizia tecnica / contaminazione' },
  { k: 'safety', t: 'Pezzo rilevante per la sicurezza (safety-relevant)' },
  { k: 'fit', t: 'Accoppiamenti / serraggio / montaggio critico' },
  { k: 'trans', t: 'Trasporto e imballaggio sensibili' }
];

const ENV_Q = {
  corr: ['Durata richiesta di resistenza a corrosione (ore in nebbia salina / numero di cicli) e criterio di accettazione (ruggine rossa, bianca, creep dal taglio)?', 'Il pezzo è esposto direttamente oppure protetto / in cavità?'],
  hot: ['Temperatura massima continua e di picco (°C) e relative durate?', 'Cicli termici previsti (range, numero di cicli)?'],
  cold: ['Temperatura minima di esercizio e di stoccaggio (°C)?'],
  vib: ['Profilo di vibrazione / urto (frequenze, accelerazioni, durata, assi) o specifica di riferimento?'],
  stat: ['Carichi statici massimi, direzioni e coefficiente di sicurezza richiesto?'],
  fat: ['Spettro di carico, numero di cicli richiesto e criterio di cedimento?'],
  press: ['Pressione di esercizio / di prova / di scoppio e fluido? Perdita massima ammessa?'],
  fluid: ['Elenco dei fluidi, temperature e durata del contatto?'],
  uv: ['Tipo di esposizione (diretta / indiretta) e requisiti di aspetto e colore da mantenere dopo invecchiamento?'],
  cosm: ['Criteri di aspetto (difetti ammessi, campioni limite, colore / gloss)? Superfici a vista?'],
  elec: ['Requisiti elettrici (resistenza, isolamento, schermatura, EMC)?'],
  wear: ['Condizioni di usura (coppia di materiali, carico, velocità, lubrificazione)?'],
  clean: ['Limite di contaminazione ammesso (dimensione / massa particelle) e specifica di riferimento?'],
  safety: ['Il cliente classifica il pezzo come safety-relevant? Quali requisiti di documentazione e tracciabilità ne derivano?'],
  fit: ['Quali accoppiamenti, coppie di serraggio o forze di montaggio sono critici?'],
  trans: ['Imballaggio previsto, tempi e condizioni di trasporto e stoccaggio?']
};

const REQS = [
  { k: 'ppap', t: 'PPAP / PPA richiesto dal cliente' },
  { k: 'imds', t: 'IMDS / REACH / RoHS (conformità materiali)' },
  { k: 'cqi', t: 'Valutazione CQI dei processi speciali richiesta' },
  { k: 'cpk', t: 'Requisiti di capability (Cpk / Ppk) sulle caratteristiche speciali' },
  { k: 'trace', t: 'Tracciabilità per lotto o individuale richiesta' },
  { k: 'runrate', t: 'Run@Rate / validazione della capacità richiesta' },
  { k: 'extlab', t: 'Laboratorio accreditato esterno richiesto (es. ISO/IEC 17025)' },
  { k: 'firstart', t: 'Campionatura iniziale (ISIR / FAI) richiesta' }
];

/* Famiglie di processo: etichetta + domande guidate per fase */
const PROC = {
  fusione: { s: 'Fusione', q: [
    'Lega e norma di riferimento? Processo (pressofusione, conchiglia, sabbia)?',

  forg: { s: 'Forgiatura', q: [
    'Acciaio / lega e stato di fornitura del semilavorato?',
    'Requisiti su flusso delle fibre, decarburazione e difetti superficiali?',
    'Trattamento termico e finitura successivi alla forgiatura?',
    'Attrezzatura: nuova, esistente o in transfer?'] },
  lam: { s: 'Stampaggio lamiera', q: [
    'Materiale, spessore, rivestimento e stato di fornitura (coil / nastri / lamiere)? Larghezza e passo di avanzamento?',
    'Tipo di stampo (progressivo, transfer, singolo) e numero di stazioni? Stampo nuovo, esistente o in transfer? Codice e proprietario?',
    'Pressa prevista: tipo, tonnellaggio, corsa e cadenza (colpi/min)? Alimentazione (da coil, a nastro, manuale)?',
    'Operazioni svolte (tranciatura, punzonatura, imbutitura, piegatura, coniatura) e zone del pezzo coinvolte?',
    'Criticità note di formatura (grinze, cricche, ritorno elastico, assottigliamento) e come sono gestite?',
    'Requisiti su bave (altezza e lato), planarità, quote di taglio, posizione dei fori e spessore residuo?',
    'Lubrificazione, sensori di protezione stampo e controlli in pressa (presenza pezzo, doppio pezzo, passo)?',
    'Manutenzione stampi: frequenza di affilatura e di controllo, scorte di parti di usura?'] },
  mecc: { s: 'Meccanica', q: [
    'Macchine / centri di lavoro previsti e attrezzaggi (staffaggi, riferimenti di presa)?',
    'Quote e tolleranze più critiche (GD&T, rugosità) generate in questa fase e relativi mezzi di misura?',

    'Refrigerante, pulizia e requisiti di sbavatura?'] },
  tt: { s: 'Trattamento termico', q: [
    'Tipo di trattamento (tempra, rinvenimento, cementazione, nitrurazione, solubilizzazione, …) e norma?',
    'Requisiti di durezza, profondità di indurimento e microstruttura?',
    'Distorsioni ammesse e fasi di raddrizzatura / lavorazione successiva?',
    'Forno interno o conto terzi? Requisiti di certificazione del processo (es. CQI-9)?'] },
  riv: { s: 'Rivestimento', q: [
    'Tipo di rivestimento e specifica del cliente?',
    'Spessore richiesto (min / max) e zone dove il rivestimento è critico o vietato (mascheratura)?',
    'Pretrattamento (sgrassaggio, fosfatazione, passivazione) e qualità del substrato?',
    'Requisiti di corrosione (ore / cicli), adesione e aspetto / colore?',
    'Punti di sospensione e contatto ammessi; geometrie critiche (cavità, spigoli)?'] },
  sald: { s: 'Saldatura', q: [

  pul: { s: 'Lavaggio', q: [

    'Metodo di verifica della pulizia (gravimetrico, particellare)?',

  mag: { s: 'Ricevimento / magazzino', q: [

    'Condizioni di stoccaggio e protezione (corrosione, contaminazione, FIFO)?'] },
  ctrl: { s: 'Controllo / collaudo', q: [
    'Quali caratteristiche si controllano in questa fase, con quale mezzo e con quale frequenza?',
    'Il mezzo di misura è qualificato (MSA / Gauge R&R)? Chi lo gestisce?',
    'Cosa succede al pezzo non conforme (segregazione, riparazione, scarto)?'] },
  imb: { s: 'Imballaggio / spedizione', q: [
    'Tipo di imballo, quantità per contenitore e protezione richiesta dal cliente?',
    'Requisiti di etichettatura e tracciabilità (lotto, data, codice a barre)?'] },
  altro: { s: 'Altro', q: [] }
};
const FAM_ORDER = ['lam', 'mecc', 'riv', 'sald', 'fusione', 'forg', 'tt', 'plast', 'ass', 'pul', 'mag', 'ctrl', 'imb', 'altro'];
const FAM_LIST = FAM_ORDER.map(k => [k, PROC[k].s]);

const TECH = {
  fusione: ['Pressofusione (HPDC)', 'Fusione in conchiglia per gravità', 'Fusione in bassa pressione', 'Fusione in sabbia', 'Microfusione', 'Squeeze casting'],
  forg: ['Stampaggio a caldo', 'Stampaggio a semi-caldo', 'Stampaggio a freddo', 'Laminazione anelli', 'Estrusione'],
  lam: ['Stampo progressivo', 'Stampo transfer', 'Tranciatura', 'Tranciatura fine (fine-blanking)', 'Imbutitura', 'Imbutitura profonda', 'Piegatura / formatura', 'Coniatura / calibratura', 'Punzonatura', 'Taglio laser', 'Taglio coil / nastri'],
  mecc: ['Tornitura', 'Fresatura CNC', 'Foratura', 'Filettatura', 'Rettifica', 'Brocciatura', 'Alesatura', 'Sbavatura', 'Lappatura / finitura'],
  tt: ['Tempra e rinvenimento', 'Cementazione', 'Carbonitrurazione', 'Nitrurazione', 'Bonifica', 'Solubilizzazione e invecchiamento', 'Ricottura', 'Distensione'],

  ass: ['Assemblaggio manuale', 'Assemblaggio automatico', 'Pressatura', 'Avvitatura', 'Rivettatura', 'Clinciatura', 'Incollaggio'],
  pul: ['Lavaggio acquoso', 'Lavaggio a solvente', 'Ultrasuoni', 'Sgrassaggio a spruzzo', 'Pulizia criogenica', 'Asciugatura'],
  mag: ['Ricevimento materiale', 'Ricevimento semilavorato da fornitore', 'Stoccaggio / buffer'],
  ctrl: ['Controllo dimensionale (CMM)', 'Controllo visivo / aspetto', 'Controlli non distruttivi', 'Collaudo funzionale', 'Controllo finale / audit di prodotto'],
  imb: ['Imballaggio', 'Etichettatura e tracciabilità', 'Spedizione'],
  altro: []

const KINDS = [['lav', 'Lavorazione'], ['acq', 'Acquisto / semilavorato'], ['ctrl', 'Controllo'], ['log', 'Logistica']];
const WHERE = ['Interno', 'Esterno (fornitore)'];
const IMG_KINDS = ['Disegno di fase', 'Screenshot 3D', 'Foto', 'Schizzo'];

const CLASSES = ['Standard', 'SC', 'CC', 'KC'];

function mergeState(loaded) {
  const base = makeEmptyState();
  if (!loaded || typeof loaded !== 'object') return base;
  const out = Object.assign({}, base, loaded);
  out.ui = Object.assign({}, base.ui, loaded.ui);
  out.meta = Object.assign({}, base.meta, loaded.meta);
  out.func = Object.assign({}, base.func, loaded.func);
  out.func.ans = Object.assign({}, loaded.func && loaded.func.ans);
  ['env', 'reqs'].forEach(k => { if (!Array.isArray(out.func[k])) out.func[k] = []; });
  out.part = Object.assign({}, base.part, loaded.part);
  if (!Array.isArray(out.part.shapes)) out.part.shapes = [];
  ['docs', 'phases', 'chars', 'risks', 'tests', 'dec'].forEach(k => { if (!Array.isArray(out[k])) out[k] = base[k]; });
  if (!Array.isArray(out.checks) || out.checks.length !== DRAW_CHECKS.length) out.checks = base.checks;
  out.phases = out.phases.map(p => Object.assign({ id: '', code: '', name: '', kind: 'lav', fam: '', tech: '', where: 'Interno', supplier: '', plant: '', machine: '', tooling: '', inp: '', out: '', desc: '', params: '', ctrl: '', ans: {}, prev: [], imgs: [], files: [] }, p, { prev: Array.isArray(p.prev) ? p.prev : [], ans: Object.assign({}, p.ans), imgs: Array.isArray(p.imgs) ? p.imgs : (p.img ? [p.img] : []), files: Array.isArray(p.files) ? p.files : [] }));
  out.phases.forEach(p => { delete p.img; });

}

function nextId(prefix, list, pad) {

  list.forEach(x => { const m = String(x.id || '').match(/(\d+)$/); if (m) max = Math.max(max, +m[1]); });
  return prefix + String(max + 1).padStart(pad || 2, '0');

const NODE = { W: 204, H: 126, GX: 60, GY: 26, PAD: 16 };

function layout(S) {
  const phases = S.phases, byId = {};
  phases.forEach(p => { byId[p.id] = p; });
  const prevOf = p => (p.prev || []).filter(id => byId[id] && id !== p.id);
  const nextOf = {}; phases.forEach(p => { nextOf[p.id] = []; });
  phases.forEach(p => prevOf(p).forEach(q => { if (!nextOf[q].includes(p.id)) nextOf[q].push(p.id); }));
  const depth = {}, stack = {};
  const dep = id => {
    if (depth[id] !== undefined) return depth[id];
    if (stack[id]) return 0;
    stack[id] = true; let m = 0;
    prevOf(byId[id]).forEach(q => { m = Math.max(m, dep(q) + 1); });
    stack[id] = false; depth[id] = m; return m;
  };
  phases.forEach(p => dep(p.id));
  const row = {}; let rc = 0;
  const place = (id, r) => {
    if (row[id] !== undefined) return;
    row[id] = r;
    prevOf(byId[id]).forEach((q, i) => { place(q, i === 0 ? r : rc++); });
  };
  const sinks = phases.filter(p => !nextOf[p.id].length).map(p => p.id);
  sinks.forEach(id => place(id, rc++));
  phases.forEach(p => { if (row[p.id] === undefined) place(p.id, rc++); });
  const pos = {}; let maxD = 0, maxR = 0;
  phases.forEach(p => {
    maxD = Math.max(maxD, depth[p.id]); maxR = Math.max(maxR, row[p.id]);
    pos[p.id] = { x: NODE.PAD + depth[p.id] * (NODE.W + NODE.GX), y: NODE.PAD + row[p.id] * (NODE.H + NODE.GY), depth: depth[p.id], row: row[p.id] };
  });
  const order = phases.slice().sort((a, b) => depth[a.id] - depth[b.id] || row[a.id] - row[b.id]);
  const edges = [];
  phases.forEach(p => prevOf(p).forEach(q => edges.push({ from: q, to: p.id })));
  return {
    pos, order, edges, sinks, nextOf,
    w: phases.length ? NODE.PAD * 2 + (maxD + 1) * (NODE.W + NODE.GX) - NODE.GX : 0,
    h: phases.length ? NODE.PAD * 2 + (maxR + 1) * (NODE.H + NODE.GY) - NODE.GY : 0
  };
}
const orderedPhases = S => layout(S).order;

function newCode(S) {
  let max = 0;
  S.phases.forEach(p => { const n = parseInt(p.code, 10); if (isFinite(n)) max = Math.max(max, n); });
  return String(max + 10);
}
function blankPhase(S, o) {

}
function addStartPhase(S) { const p = blankPhase(S, { name: 'Fase iniziale' }); S.phases.push(p); return p; }
function insertAfter(S, id) {
  const np = blankPhase(S, { prev: [id], name: 'Nuova fase' });
  S.phases.forEach(q => { if (q.prev.includes(id)) q.prev = q.prev.map(x => (x === id ? np.id : x)); });
  S.phases.push(np); return np;
}
function addBranch(S, id) {
  const np = blankPhase(S, { prev: [], kind: 'acq', name: 'Semilavorato / componente in ingresso' });
  const tgt = phaseById(S, id); if (tgt) tgt.prev.push(np.id);
  S.phases.push(np); return np;
}
function removePhase(S, id) {
  const p = phaseById(S, id); if (!p) return null;
  const info = { risks: S.risks.filter(r => r.phase === id).length, tests: S.tests.filter(t => t.phase === id).length };
  S.phases.forEach(q => {
    if (q.prev.includes(id)) {
      const np = []; q.prev.forEach(x => { (x === id ? p.prev : [x]).forEach(y => { if (!np.includes(y)) np.push(y); }); });
      q.prev = np;
    }
  });

   VALUTAZIONE, STATISTICHE, PROVE SUGGERITE, GAP

function rating(c) {
  const s = parseFloat(c.s), o = parseFloat(c.o), d = parseFloat(c.d);
  if (![s, o, d].every(x => isFinite(x))) return { rpn: '', liv: '' };
  const rpn = s * o * d;
  return { rpn, liv: (s >= 9 || rpn >= 100) ? 'Alto' : (rpn >= 50 ? 'Medio' : 'Basso') };
}
const LV_RANK = { Alto: 3, Medio: 2, Basso: 1, '': 0 };
function maxLevel(list) { let m = ''; list.forEach(r => { const l = rating(r).liv; if (LV_RANK[l] > LV_RANK[m]) m = l; }); return m; }

function phaseStats(S, p) {
  const risks = S.risks.filter(r => r.phase === p.id);
  return {
    gen: S.chars.filter(c => c.gen === p.id).length,
    infl: S.chars.filter(c => c.infl.includes(p.id)).length,
    risks: risks.length, max: maxLevel(risks),
    tests: S.tests.filter(t => t.phase === p.id).length,
    img: p.imgs.length > 0, imgs: p.imgs.length, files: p.files.length, undef: !p.name || (p.kind === 'lav' && !p.tech)
  };
}

function computeGlobalTags(S) {
  const t = new Set(['always']);
  S.func.env.forEach(k => t.add('e:' + k));
  S.func.reqs.forEach(k => t.add('r:' + k));
  if (S.chars.some(c => ['KC', 'CC', 'SC'].includes(c.cls))) t.add('cc');
  if (S.meta.nuovoProcesso && S.meta.nuovoProcesso !== 'esistente') t.add('newproc');
  if (S.meta.nuovoProcesso === 'transfer') t.add('transfer');
  return t;
}
function tagLabel(tag) {
  if (tag === 'always') return 'Base per ogni pezzo';
  if (tag === 'cc') return 'Caratteristiche speciali';
  if (tag === 'newproc') return 'Processo nuovo / modificato';
  if (tag === 'transfer') return 'Transfer';
  const [kind, k] = tag.split(':');
  if (kind === 'e') { const e = ENV.find(x => x.k === k); return e ? shortLabel(e.t) : tag; }
  if (kind === 'r') { const r = REQS.find(x => x.k === k); return r ? shortLabel(r.t) : tag; }
  return tag;
}

/* Prove proposte: per fase (famiglia, esecuzione esterna, criticità) e generali (ambiente, requisiti) */
function suggestions(S) {
  const gt = computeGlobalTags(S);
  const out = {}; // chiave lib|fase
  const have = new Set(S.tests.map(t => (t.lib || '') + '|' + (t.phase || '')));
  const add = (lib, phase, why, ctx) => {
    const key = lib.id + '|' + phase;
    if (have.has(key)) return;
    if (!out[key]) out[key] = { lib, phase, why: [], risk: (ctx && ctx.risk) || '', char: (ctx && ctx.char) || '' };
    if (why && !out[key].why.includes(why)) out[key].why.push(why);
    if (ctx && ctx.risk && !out[key].risk) { out[key].risk = ctx.risk; out[key].char = ctx.char || out[key].char; }
  };
  TEST_LIB.forEach(t => {
    const pt = t.tag.filter(x => /^[pf]:/.test(x)), gtags = t.tag.filter(x => !/^[pf]:/.test(x));
    const matched = [];
    S.phases.forEach(p => {
      if (pt.some(x => (x[0] === 'p' && x.slice(2) === p.fam) || (x === 'f:ext' && p.where === 'Esterno (fornitore)') || (x === 'f:acq' && p.kind === 'acq'))) matched.push(p);
    });
    if (matched.length) matched.forEach(p => add(t, p.id, 'Fase ' + (p.code || '') + (p.tech ? ' – ' + p.tech : (p.fam ? ' – ' + famName(p.fam) : ''))));
    else { const m = gtags.filter(x => gt.has(x)); if (m.length) add(t, '', m.map(tagLabel).join(', ')); }
  });
  S.risks.forEach(r => {
    const rating_ = rating(r);
    (r.sug || []).forEach(id => { const lib = LIB_BY_ID[id]; if (lib && S.phases.some(p => p.id === r.phase)) add(lib, r.phase, 'Criticità: ' + r.mode, { risk: r.id, char: r.char }); });
    void rating_;
  });
  return Object.keys(out).map(k => out[k]);
}

function testFromLib(lib, S, ctx) {
  ctx = ctx || {};
  return { id: nextId('DVP-', S.tests, 2), lib: lib.id, cat: lib.cat, phase: ctx.phase || '', char: ctx.char || '', risk: ctx.risk || '', nome: lib.nome, norma: lib.norma, crit: lib.crit, n: lib.n, fase: lib.fase, luogo: lib.luogo, resp: '', dp: '', de: '', costo: '', stato: 'Da pianificare', note: '', rif: '' };
}
function riskHasTest(S, r) { return S.tests.some(t => t.risk === r.id || (t.phase === r.phase && (r.sug || []).includes(t.lib))); }
function charTests(S, c) { return S.tests.filter(t => t.char === c.id || S.risks.some(r => r.id === t.risk && r.char === c.id)); }

function computeGaps(S) {
  const g = []; const add = (sev, area, msg, go) => g.push({ sev, area, msg, go: go || null });
  const m = S.meta;
  if (!m.progetto || !m.cliente || !m.codice) add('Media', 'Progetto', 'Dati di progetto incompleti (progetto, cliente, codice pezzo).', { s: STEP.prog });
  S.docs.forEach(d => {
    if (d.req === 'Sì' && d.stato !== 'Ricevuto' && d.stato !== 'Non applicabile') add('Alta', 'Documenti', 'Documento obbligatorio non ricevuto: ' + d.t + ' (stato: ' + d.stato + ').', { s: STEP.prog });
    else if (d.req !== 'Sì' && d.stato === 'Da richiedere') add('Media', 'Documenti', 'Documento da richiedere al cliente: ' + d.t + '.', { s: STEP.prog });
  });
  S.checks.forEach((c, i) => { if (c === 'No') add('Media', 'Disegno', 'Da chiarire con il cliente: ' + DRAW_CHECKS[i] + '.', { s: STEP.prog }); });
  const todo = S.checks.filter(c => c === 'Da verificare').length;
  if (todo) add('Info', 'Disegno', todo + ' verifiche di completezza del disegno ancora da eseguire.', { s: STEP.prog });
  if (!S.part.img) add('Media', 'Pezzo', 'Disegno del pezzo non caricato: le caratteristiche non possono essere ballonate.', { s: STEP.pezzo });
  if (!S.func.funzione) add('Media', 'Funzione', 'Funzione del pezzo non descritta.', { s: STEP.func });
  if (!S.func.env.length) add('Info', 'Funzione', 'Nessuna condizione ambientale o di carico selezionata: confermare che non ve ne siano.', { s: STEP.func });
  if (!S.phases.length) add('Alta', 'Ciclo', 'Ciclo produttivo non descritto.', { s: STEP.ciclo });

  if (S.phases.length && L.sinks.length > 1) add('Media', 'Ciclo', 'Il ciclo ha ' + L.sinks.length + ' fasi finali: verificare che i rami confluiscano in un’unica fase.', { s: STEP.ciclo });
  S.phases.forEach(p => {
    const nm = phaseLabel(S, p.id), go = tab => ({ s: STEP.ciclo, p: p.id, tab });
    const st = phaseStats(S, p);
    if (!p.name) add('Media', 'Fase', 'Fase ' + p.code + ' senza nome.', go('fase'));
    if (p.kind === 'lav' && !p.tech) add('Media', 'Fase', nm + ': tecnologia di processo non indicata.', go('fase'));
    if (p.kind === 'lav' && !p.desc) add('Media', 'Fase', nm + ': non è descritto cosa viene fatto sul pezzo.', go('fase'));

  });
  if (!S.chars.length) add('Alta', 'Caratteristiche', 'Nessuna caratteristica censita: il piano di prova non ha cosa verificare.', { s: STEP.pezzo });
  S.chars.forEach(c => {
    const nm = c.id + (c.car ? ' – ' + c.car : '');

    if (S.phases.length && !c.gen) add('Media', 'Caratteristiche', 'Caratteristica non assegnata a una fase generatrice: ' + nm + '.', { s: STEP.pezzo });
  });
  if (!S.tests.length) add('Alta', 'Prove', 'Nessuna prova pianificata.', { s: STEP.piano });
  S.tests.forEach(t => {
    const nm = t.id + ' – ' + (t.nome || 'senza nome');

    if (!t.crit) add('Media', 'Prove', 'Criterio di accettazione mancante: ' + nm + '.', { s: STEP.piano });
  });

const PARAMRE = /\d+(?:[.,]\d+)?\s?(?:°c|°|bar|min\b|minuti|secondi|\bs\b|kn\b|tonnellate|\bt\b|rpm|giri|µm|\bum\b|micron|\bv\b|volt|ampere|n ?m\b|mm\/min|hz|colpi|g\/l|%)/i;

const ALIAS = [[/\bnss\b|salt spray|nebbia/, 'nebbia salina corrosione'], [/\bcmm\b|layout/, 'layout dimensionale'], [/grr|gauge/, 'gauge msa'], [/capability|cpk|ppk/, 'capability cpk ppk'], [/vibrazion/, 'vibrazioni'], [/fatica/, 'fatica'], [/\btenuta\b|perdita/, 'tenuta'], [/\bdurezza\b/, 'durezza'], [/spessore (del )?rivestimento|spessori/, 'spessore rivestimento'], [/aderenza/, 'aderenza'], [/\bcoppia\b/, 'coppia']];

/* ---------- validazione (vale anche per le risposte dell'AI) ---------- */
const OPFIELDS = {
  meta: ['progetto', 'cliente', 'codice', 'codiceInt', 'descrizione', 'revDisegno', 'plant', 'owner', 'team', 'note', 'nuovoProcesso', 'fase', 'ppap', 'normaRef'],
  part: ['materiale', 'massa', 'dimensioni'],

  phase: ['name', 'kind', 'fam', 'tech', 'where', 'supplier', 'machine', 'tooling', 'inp', 'out', 'desc', 'params', 'ctrl'],
  phaseEdit: ['kind', 'fam', 'tech', 'where', 'supplier', 'machine', 'tooling', 'inp', 'out', 'desc', 'params', 'ctrl']

const ENUM = { nuovoProcesso: ['nuovo', 'esistente', 'transfer', 'eco'], fase: ['Offerta / fattibilità', 'Industrializzazione', 'Prototipi / pre-serie', 'Validazione processo / PPAP', 'Serie'], ppap: ['Non richiesto', 'Livello 1', 'Livello 2', 'Livello 3', 'Livello 4', 'Livello 5'] };

}

/* ---------- anteprima e applicazione ---------- */
const META_L = { progetto: 'Progetto', cliente: 'Cliente', codice: 'Codice pezzo', codiceInt: 'Codice interno', descrizione: 'Descrizione', revDisegno: 'Rev. disegno', plant: 'Stabilimento', owner: 'Responsabile', team: 'Team', note: 'Note', nuovoProcesso: 'Tipo di processo', fase: 'Fase del progetto', ppap: 'PPAP', normaRef: 'Norme qualità', materiale: 'Materiale', massa: 'Massa', dimensioni: 'Dimensioni' };
function describe(op, S) {

      case 'part': Object.keys(op.f).forEach(k => { S.part[k] = op.f[k]; n.fields++; }); break;
      case 'func':
        Object.keys(op.f).forEach(k => { const cur = S.func[k] || ''; if (!cur) S.func[k] = op.f[k]; else if (!cur.includes(op.f[k])) S.func[k] = cur + '\n' + op.f[k]; n.fields++; });

        if (mode === 'part') { const c = { id: D.nextId('C', S.chars, 2), car: '', spec: '', cls: 'Standard', orig: 'Disegno', gen: '', infl: [], note: '' }; S.chars.push(c); cid = c.id; n = parseInt(c.id.replace(/\D/g, ''), 10); }
        else { n = 1 + Math.max(0, ...im.shapes.filter(s => s.t === 'pin').map(s => s.n)); }
        im.shapes.push({ t: 'pin', x: p.x, y: p.y, n, c: color(), cid });
        persist(); if (mode === 'part') { render(true); setTimeout(() => { const el = $('.ccard:last-of-type input'); if (el) { el.focus(); el.scrollIntoView({ block: 'nearest' }); } }, 0); } else redraw();
        return;
      }
      if (tool === 'txt') { const s = prompt('Testo da inserire sul disegno'); if (s) { im.shapes.push({ t: 'txt', x: p.x, y: p.y, s, c: color() }); persist(); redraw(); } return; }
      if (tool === 'erase') { for (let i = im.shapes.length - 1; i >= 0; i--) { if (hit(im.shapes[i], p, cv.width, cv.height)) { im.shapes.splice(i, 1); persist(); redraw(); break; } } return; }
      cv.setPointerCapture(e.pointerId); drawing = true;
      if (tool === 'free') cur = { t: 'free', pts: [[p.x, p.y]], c: color() };
      else if (tool === 'arr') cur = { t: 'arr', x1: p.x, y1: p.y, x2: p.x, y2: p.y, c: color() };
      else cur = { t: tool, x: p.x, y: p.y, w: 0, h: 0, c: color(), ox: p.x, oy: p.y };
    });
    cv.addEventListener('pointermove', e => {
      if (!drawing || !cur) return; const p = pos(e);
      if (cur.t === 'free') cur.pts.push([p.x, p.y]);
      else if (cur.t === 'arr') { cur.x2 = p.x; cur.y2 = p.y; }
      else { cur.x = Math.min(cur.ox, p.x); cur.y = Math.min(cur.oy, p.y); cur.w = Math.abs(p.x - cur.ox); cur.h = Math.abs(p.y - cur.oy); }
      redraw();
    });
    const end = () => {
      if (!drawing) return; drawing = false;
      const s = cur; cur = null;
      const big = s && (s.t === 'free' ? s.pts.length > 2 : s.t === 'arr' ? Math.hypot((s.x2 - s.x1) * cv.width, (s.y2 - s.y1) * cv.height) > 8 : (s.w * cv.width > 6 && s.h * cv.height > 6));
      if (big) { delete s.ox; delete s.oy; im.shapes.push(s); persist(); }
      redraw();
    };
    cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
    host.addEventListener('click', e => {
      const t = e.target.closest('[data-tool]'); if (t) { AN[mode] = t.dataset.tool; $$('[data-tool]', host).forEach(b => b.classList.toggle('on', b === t)); return; }
      const c = e.target.closest('[data-color]'); if (c) { AN.color = c.dataset.color; $$('.annot [data-color]').forEach(b => b.classList.toggle('on', b.dataset.color === AN.color)); return; }
      const a = e.target.closest('[data-ac]'); if (!a) return;
      if (a.dataset.ac === 'undo') {
        const s = im.shapes.pop();
        if (s && s.t === 'pin' && s.cid) { const ch = D.charById(S, s.cid); if (ch && !ch.car && !ch.spec) { S.chars = S.chars.filter(x => x.id !== s.cid); persist(); render(true); return; } }
        persist(); redraw();
      } else if (a.dataset.ac === 'clear') { if (im.shapes.length && confirm('Cancellare tutte le annotazioni di questa immagine?')) { im.shapes = []; persist(); redraw(); } }
    });
  });
}
async function flatten(im) {
  const el = await getImg(im);
  const cv = document.createElement('canvas'); cv.width = im.w; cv.height = im.h;
  const ctx = cv.getContext('2d'); ctx.drawImage(el, 0, 0, im.w, im.h); drawShapes(ctx, im.shapes || [], im.w, im.h);
  const url = cv.toDataURL('image/jpeg', 0.9);
  return { url, b64: url.split(',')[1], ext: 'jpeg', w: im.w, h: im.h };
}
async function collectImages() {
  const images = {}, urls = {};
  if (S.part.img) { const f = await flatten(S.part.img); images.part = f; urls.part = f.url; }
  for (const p of S.phases) for (let j = 0; j < p.imgs.length; j++) { const f = await flatten(p.imgs[j]); images[p.id + '#' + j] = f; urls[p.id + '#' + j] = f.url; }
  return { images, urls };
}

/* =====================================================================
   STATO DEI PASSI E RENDER
   ===================================================================== */
function statusOf(i) {
  switch (i) {
    case 0: { const n = [S.meta.progetto, S.meta.cliente, S.meta.codice].filter(Boolean).length; return n === 3 ? 2 : n ? 1 : 0; }
    case 1: return S.part.img && S.chars.length ? 2 : (S.part.img || S.chars.length ? 1 : 0);
    case 2: return S.func.funzione && (S.func.env.length || S.func.reqs.length) ? 2 : (S.func.funzione || S.func.env.length ? 1 : 0);
    case 3: { if (!S.phases.length) return 0; return S.phases.every(p => p.name && (p.kind !== 'lav' || (p.tech && p.desc))) ? 2 : 1; }
    case 4: return !S.tests.length ? 0 : (D.computeGaps(S).some(g => g.sev === 'Alta') ? 1 : 2);
    case 5: return S.dec.length ? 2 : 0;
    case 6: return S.tests.length && !D.computeGaps(S).some(g => g.sev === 'Alta') ? 2 : 1;
  }
  return 0;
}

  function ui(on) { active = on; if (window.__voice && window.__voice.onstate) window.__voice.onstate(on); $d('vmic').classList.toggle('on', on); $d('vmic').textContent = on ? '⏹' : '🎤'; if (!on) $d('vtext').textContent = ''; }
  function stop() { if (rec) { try { rec.stop(); } catch (e) {} } }
  function start(opt) {
    if (!SR) { toast('Il riconoscimento vocale non è disponibile in questo browser: usa Chrome o Edge.'); return; }
    if (active) { stop(); return; }
    if (!target()) { toast('Prima clicca sul campo da compilare.'); return; }
    rec = new SR(); rec.lang = lang; rec.interimResults = true; rec.continuous = true; rec.maxAlternatives = 1;
    const one = ['SELECT'].includes(target().tagName) || ['number', 'date'].includes((target().type || '').toLowerCase());
    rec.onresult = ev => {
      let interim = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const r = ev.results[i], tx = r[0].transcript;
        if (r.isFinal) { if (apply(tx) && one) stop(); } else interim += tx;
      }
      $d('vtext').textContent = interim ? '… ' + interim : '';
      if (window.__voice && window.__voice.oninterim) window.__voice.oninterim(interim);
    };
    rec.onerror = ev => {
      const m = { 'not-allowed': 'Microfono non autorizzato: consenti l’accesso al microfono nel browser.', 'service-not-allowed': 'Servizio vocale non consentito dal browser.', 'no-speech': 'Nessuna voce rilevata.', 'audio-capture': 'Nessun microfono trovato.', 'network': 'Il riconoscimento vocale richiede la connessione a internet.' };
      if (ev.error !== 'aborted') toast(m[ev.error] || ('Errore del riconoscimento vocale: ' + ev.error));
    };
    rec.onend = () => ui(false);
    try { rec.start(); ui(true); const e = target(); if (e && !(opt && opt.nofocus)) e.focus(); } catch (e) { ui(false); }
  }
  $d('vmic').addEventListener('mousedown', e => e.preventDefault());
  $d('vmic').addEventListener('click', () => start());
  $d('vlang').addEventListener('change', e => { lang = e.target.value; try { localStorage.setItem('dvp_voice_lang', lang); } catch (x) {} stop(); });
  document.addEventListener('keydown', e => { if (e.altKey && (e.key === 'm' || e.key === 'M')) { e.preventDefault(); start(); } });
  if (!SR) { $d('vmic').classList.add('off'); $d('vtarget').textContent = 'Dettatura non disponibile: usa Chrome o Edge'; }
  document.addEventListener('focusin', e => { if (isField(e.target) && !e.target.closest('#sheet')) document.body.classList.add('fieldfocus'); });
  document.addEventListener('pointerdown', e => { if (!isField(e.target) && !dock.contains(e.target)) setTimeout(() => document.body.classList.remove('fieldfocus'), 0); });
  window.__voice = { apply, setLast, start, stop, supported: !!SR, lang: () => lang, setLang: v => { lang = v; try { localStorage.setItem('dvp_voice_lang', v); } catch (x) { /* ok */ } const s = $d('vlang'); if (s) s.value = v; stop(); } };
})();

/* =====================================================================
   FOGLI, DETTATURA GUIDATA (formalizza e classifica), INSTALLAZIONE
   ===================================================================== */
const I = window.DVPI;
const sheetEl = $('#sheet'), sheetBody = $('#sheetBody');
function openSheet(html) { sheetBody.innerHTML = '<div class="sheet-grip"></div>' + html; sheetEl.classList.add('open'); document.body.classList.add('sheet-open'); sheetBody.scrollTop = 0; }
function closeSheet() { if (window.__voice) window.__voice.stop(); sheetEl.classList.remove('open'); document.body.classList.remove('sheet-open'); dz = null; }
const xBtn = '<button class="sheet-x" data-act="closeSheet" aria-label="Chiudi">✕</button>';

function stepsSheet() {
  openSheet(xBtn + '<h3>Passi</h3><div class="steplist">' + STEPS.map((s, i) => { const st = statusOf(i); return '<button class="nav-item' + (i === S.ui.step ? ' on' : '') + '" data-act="goto" data-i="' + i + '"><span class="dot s' + st + '">' + (st === 2 ? '✓' : i + 1) + '</span><span>' + s.t + '</span></button>'; }).join('') + '</div>');
}

/* ---- impostazioni AI (chiave solo su questo dispositivo) ---- */
function aiCfg() { try { return JSON.parse(localStorage.getItem('dvp_ai') || '{}'); } catch (e) { return {}; } }
function aiSave(c) { try { localStorage.setItem('dvp_ai', JSON.stringify(c)); } catch (e) { /* storage non disponibile */ } }
function aiSheet() {
  const c = aiCfg();
  openSheet(xBtn + '<h3>Impostazioni AI</h3><p class="hint">Con una chiave API Anthropic, «Formalizza» usa Claude per capire meglio il dettato. Senza chiave l’app usa regole locali, che funzionano anche offline ma sono più rigide.</p>' +
    '<div class="note">La chiave resta solo su questo dispositivo. Con la modalità AI il testo dettato viene inviato ad Anthropic: non usarla per dati riservati del cliente senza autorizzazione. Con le regole locali nulla lascia il telefono (salvo il servizio vocale del browser per la dettatura).</div>' +
    '<div class="grid2"><label class="f wide"><span>Chiave API</span><input id="aiKey" type="password" autocomplete="off" placeholder="sk-ant-…" value="' + esc(c.key || '') + '"></label>' +
    '<label class="f wide"><span>Modello</span><input id="aiModel" type="text" value="' + esc(c.model || 'claude-sonnet-5-5') + '"></label></div>' +
    '<div class="row-actions"><button class="btn primary" data-act="aiSave">Salva</button><button class="btn" data-act="aiClear">Rimuovi chiave</button></div>' +
    '<p class="small">In alternativa, senza chiave: nella finestra «Detta» usa «Copia richiesta», incollala nell’app Claude e riporta qui la risposta.</p>');
}
async function callAI(scope, text, ctx) {
  const c = aiCfg(); if (!c.key) throw new Error('Chiave AI non impostata.');
  const pr = I.buildPrompt(scope, text, S, ctx);
  const r = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'content-type': 'application/json', 'x-api-key': c.key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
    body: JSON.stringify({ model: c.model || 'claude-sonnet-5-5', max_tokens: 4000, system: pr.system, messages: [{ role: 'user', content: pr.user }] }) });
  if (!r.ok) { let m = ''; try { m = (await r.json()).error.message; } catch (e) { m = r.status; } throw new Error('Servizio AI: ' + m); }
  const j = await r.json();
  return I.parseAI((j.content || []).map(x => x.text || '').join(''), S);
}

/* ---- finestra «Detta e compila» ---- */
let dz = null;
const SC_INFO = {
  prog: ['Progetto e documenti', 'Es.: «Progetto staffa supporto motore, cliente Rossi, codice pezzo ABC-123, responsabile Marco Bianchi, stabilimento EMEC1. È un transfer, siamo in industrializzazione.»'],
  pezzo: ['Pezzo e caratteristiche', 'Es.: «Materiale S355, pesa 0,85 kg, ingombro 120 per 80 per 45. Diametro foro 12 H7, caratteristica critica. Planarità 0,2 sul piano di appoggio.»'],
  func: ['Funzione e requisiti', 'Es.: «Il pezzo sostiene il gruppo motore e si avvita al basamento. Vita dieci anni. Vibrazioni e nebbia salina 480 ore. Richiesto PPAP livello 3.»'],
  ciclo: ['Ciclo produttivo', 'Es.: «Ricevimento coil, stampaggio a stampo progressivo, sbavatura, lavaggio, KTL da fornitore, controllo finale, imballaggio.» Per un ramo dì «in parallelo …»; per unirli, «saldatura dei due componenti».'],
  fase: ['Dettaglio della fase', 'Es.: «Si esegue sulla pressa da 400 tonnellate. Spessore del nastro 2 mm, velocità 40 colpi al minuto. Controllo la bava a ogni cambio lotto. Il rischio è la bava oltre il limite per usura del punzone.»'],
  piano: ['Piano e criticità', 'Es.: «Serve una prova di nebbia salina 480 ore sul pezzo finito. Nel KTL il rischio è la scarsa aderenza.»'],
  dec: ['Decisioni e azioni', 'Es.: «Abbiamo deciso di ripetere le prove DV nel nuovo sito perché cambia la linea. Dobbiamo chiedere al cliente la specifica di corrosione, responsabile Marco Bianchi, entro il 20 novembre.»']
};
function scopeForStep() { const s = S.ui.step; return s === 0 ? 'prog' : s === 1 ? 'pezzo' : s === 2 ? 'func' : s === 3 ? (S.phases.length && S.ui.phase ? 'fase' : 'ciclo') : s === 4 ? 'piano' : 'dec'; }
function dictateOpen(scope) {
  let mode = 'local'; try { mode = localStorage.getItem('dvp_dmode') || 'local'; } catch (e) { /* nessuna preferenza */ }
  if (mode === 'ai' && !aiCfg().key) mode = 'local';
  dz = { scope: scope || scopeForStep(), text: '', mode, ops: null, sel: new Set(), note: '' };
  dictateRender(true);
}
function dictateRender(focus) {
  if (window.__voice) window.__voice.stop();
  const inf = SC_INFO[dz.scope], hasKey = !!aiCfg().key, ph = D.phaseById(S, S.ui.phase);
  if (dz.ops) {
    const n = dz.sel.size;
    openSheet(xBtn + '<h3>Proposte: ' + inf[0] + '</h3>' + (dz.note ? '<div class="note">' + esc(dz.note) + '</div>' : '') +
      (dz.ops.length ? '<p class="hint">Controlla e togli la spunta a ciò che non serve. Nulla viene scritto finché non applichi.</p>' + dz.ops.map((op, i) => { const d = I.describe(op, S); return '<label class="pv' + (dz.sel.has(i) ? '' : ' off') + '"><input type="checkbox" data-dsel="' + i + '"' + (dz.sel.has(i) ? ' checked' : '') + '><div><b>' + esc(d.t) + '</b><span>' + esc(d.d) + '</span></div></label>'; }).join('')
        : '<p class="empty">Non ho riconosciuto elementi da inserire. Riformula il testo, ad esempio con frasi più brevi, oppure usa la modalità AI.</p>') +
      '<div class="row-actions"><button class="btn primary big" data-act="dApply"' + (n ? '' : ' disabled') + '>Applica' + (n ? ' (' + n + ')' : '') + '</button><button class="btn big" data-act="dBack">← Modifica il testo</button></div>');
    return;
  }
  openSheet(xBtn + '<h3>Detta e compila</h3><p class="hint"><b>' + inf[0] + '</b>. Parla o scrivi liberamente: l’app formalizza, classifica e ti mostra le proposte prima di scrivere.</p>' +
    (S.ui.step === 3 && S.phases.length ? '<div class="seg"><button data-act="dscope" data-s="ciclo" class="' + (dz.scope === 'ciclo' ? 'on' : '') + '">Intero ciclo</button><button data-act="dscope" data-s="fase" class="' + (dz.scope === 'fase' ? 'on' : '') + '">Fase ' + esc(ph ? ph.code : '') + '</button></div>' : '') +
    '<textarea id="dtext" class="d-text" placeholder="' + esc(inf[1]) + '">' + esc(dz.text) + '</textarea>' +
    '<div class="d-ctl"><button class="d-mic' + (window.__voice && window.__voice.supported ? '' : ' off') + '" id="dmic" data-act="dmic" aria-label="Detta">🎤</button><div class="d-live" id="dlive">' + (window.__voice && window.__voice.supported ? 'Tocca il microfono e parla' : 'Dettatura non disponibile qui: usa il microfono della tastiera') + '</div>' +
    '<select id="dlang" style="width:auto">' + [['it-IT', 'Italiano'], ['en-US', 'English'], ['sk-SK', 'Slovenčina'], ['zh-CN', '中文']].map(l => '<option value="' + l[0] + '"' + (window.__voice && window.__voice.lang() === l[0] ? ' selected' : '') + '>' + l[1] + '</option>').join('') + '</select></div>' +
    '<div class="seg"><button data-act="dmode" data-m="local" class="' + (dz.mode === 'local' ? 'on' : '') + '">Regole locali</button><button data-act="dmode" data-m="ai" class="' + (dz.mode === 'ai' ? 'on' : '') + '">AI Claude' + (hasKey ? '' : ' (chiave da impostare)') + '</button></div>' +
    '<button class="btn primary d-go" data-act="dRun">Formalizza e classifica</button>' +
    '<details><summary>Usa l’app Claude (senza chiave)</summary><p class="small">1) «Copia richiesta», 2) incollala in una chat con Claude, 3) copia la risposta e incollala qui sotto.</p><div class="row-actions"><button class="btn small" data-act="dCopy">Copia richiesta</button></div>' +
    '<textarea id="dpaste" rows="3" placeholder="Incolla qui la risposta JSON di Claude"></textarea><div class="row-actions"><button class="btn small" data-act="dParse">Anteprima della risposta</button></div></details>');
  if (focus && window.matchMedia && !window.matchMedia('(max-width:900px)').matches) { const t = $('#dtext'); if (t) t.focus(); }
}
function dictateCtx() { return { phase: S.ui.phase }; }
async function dictateRun() {
  const ta = $('#dtext'); const text = ta ? ta.value.trim() : ''; if (!text) { toast('Detta o scrivi prima il testo.'); return; }
  dz.text = text; dz.note = '';
  let ops;
  if (dz.mode === 'ai') {
    try { busy(true, 'Formalizzazione con l’AI…'); ops = await callAI(dz.scope, text, dictateCtx()); }
    catch (e) { dz.note = 'AI non disponibile (' + (e && e.message ? e.message : 'errore') + '): ho usato le regole locali.'; ops = I.interpret(dz.scope, text, S, dictateCtx()); }
    finally { busy(false); }
  } else ops = I.interpret(dz.scope, text, S, dictateCtx());
  if (dz.scope === 'fase' && !D.phaseById(S, S.ui.phase)) dz.note = 'Nessuna fase selezionata: seleziona una fase del ciclo.';
  dz.ops = ops; dz.sel = new Set(ops.map((_, i) => i)); dictateRender();
}
function dictateApply() {
  if (!dz || !dz.ops) return;
  const ops = dz.ops.filter((_, i) => dz.sel.has(i)); const scope = dz.scope;
  const r = I.applyOps(S, ops); const n = r.n;
  closeSheet();
  if (r.first && (scope === 'ciclo' || scope === 'fase')) { S.ui.step = D.STEP.ciclo; S.ui.phase = r.first; S.ui.tab = 'fase'; }
  persist(); render(); renderNav();
  const parts = [n.phases && n.phases + ' fasi', n.chars && n.chars + ' caratteristiche', n.risks && n.risks + ' criticità', n.tests && n.tests + ' prove', n.dec && n.dec + ' voci di registro', n.fields && n.fields + ' campi'].filter(Boolean);
  toast(parts.length ? 'Inserito: ' + parts.join(', ') + '.' : 'Nessuna modifica (voci già presenti).');
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {
    const a = document.createElement('textarea'); a.value = t; a.style.position = 'fixed'; a.style.opacity = '0'; document.body.appendChild(a); a.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (x) { ok = false; } a.remove(); return ok;
  }
}
Object.assign(ACT, {
  menu: () => { $('#topActions').classList.toggle('open'); },
  steps: () => stepsSheet(),
  closeSheet: () => closeSheet(),
  dictate: b => dictateOpen(b && b.dataset && b.dataset.scope),
  dscope: b => { dz.text = ($('#dtext') || {}).value || dz.text; dz.scope = b.dataset.s; dictateRender(); },
  dmode: b => { if (b.dataset.m === 'ai' && !aiCfg().key) { closeSheet(); aiSheet(); return; } dz.text = ($('#dtext') || {}).value || dz.text; dz.mode = b.dataset.m; try { localStorage.setItem('dvp_dmode', dz.mode); } catch (e) { /* ok */ } dictateRender(); },
  dmic: () => { const t = $('#dtext'); if (!t || !window.__voice) return; window.__voice.setLast(t); window.__voice.start({ nofocus: true }); },
  dRun: () => dictateRun(),
  dBack: () => { dz.ops = null; dictateRender(); },
  dApply: () => dictateApply(),
  dCopy: async b => { const t = ($('#dtext') || {}).value || ''; if (!t.trim()) { toast('Scrivi o detta prima il testo.'); return; } const pr = I.buildPrompt(dz.scope, t.trim(), S, dictateCtx()); toast(await copyText(pr.system + '\n\n' + pr.user) ? 'Richiesta copiata: incollala nell’app Claude.' : 'Copia non riuscita: seleziona il testo a mano.'); },
  dParse: () => { dz.text = ($('#dtext') || {}).value || dz.text; try { dz.ops = I.parseAI(($('#dpaste') || {}).value, S); dz.sel = new Set(dz.ops.map((_, i) => i)); dz.note = ''; dictateRender(); } catch (e) { toast(e.message || 'Risposta non leggibile.'); } },
  aiSet: () => aiSheet(),
  aiSave: () => { aiSave({ key: ($('#aiKey') || {}).value.trim(), model: (($('#aiModel') || {}).value || '').trim() || 'claude-sonnet-5-5' }); closeSheet(); toast('Impostazioni AI salvate su questo dispositivo.'); },
  aiClear: () => { aiSave({}); try { localStorage.removeItem('dvp_dmode'); } catch (e) { /* ok */ } closeSheet(); toast('Chiave rimossa.'); },
  install: () => installSheet()
});
sheetBody.addEventListener('input', e => { if (e.target.id === 'dtext' && dz) dz.text = e.target.value; });
sheetBody.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.dsel != null && dz) { t.checked ? dz.sel.add(+t.dataset.dsel) : dz.sel.delete(+t.dataset.dsel); dictateRender(); }
  if (t.id === 'dlang' && window.__voice) window.__voice.setLang(t.value);
});
document.addEventListener('click', e => { const m = $('#topActions'); if (m && m.classList.contains('open') && !e.target.closest('.menu-btn')) m.classList.remove('open'); }, true);

/* ---- installazione come app ---- */
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; });
window.addEventListener('appinstalled', () => { deferredInstall = null; toast('App installata.'); });
function installSheet() {
  const standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
  const http = /^https?:$/.test(location.protocol);
  openSheet(xBtn + '<h3>Installa sul telefono</h3>' + (standalone ? '<p>L’app è già installata su questo dispositivo.</p>' :
    (deferredInstall ? '<div class="row-actions"><button class="btn primary big" data-act="doInstall">Installa ora</button></div>' : '') +
    (http ? '' : '<div class="note">Per installare l’app serve aprirla da un indirizzo https (non da un file locale).</div>') +
    '<p><b>Android (Chrome)</b>: menu ⋮ → «Installa app» oppure «Aggiungi a schermata Home».</p><p><b>iPhone (Safari)</b>: tasto Condividi → «Aggiungi alla schermata Home».</p><p class="small">Dopo la prima apertura l’app funziona anche senza rete. I dati restano sul dispositivo; per spostarli usa «Salva progetto».</p>'));
}
ACT.doInstall = async () => { if (!deferredInstall) return; deferredInstall.prompt(); try { await deferredInstall.userChoice; } catch (e) { /* ignora */ } deferredInstall = null; closeSheet(); };

window.__dvp = { get state() { return S; }, set state(v) { S = v; }, render, ACT, flatten, collectImages };
init();
})();
